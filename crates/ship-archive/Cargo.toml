[package]
name = "antelope-ship-archive"
description = "Serve frozen Antelope state-history and block logs over the SHiP WebSocket protocol exactly as a Spring node does, so that a SHiP-aware router or proxy can stitch archived ranges and live nodes into one history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The library holds the whole server, so integration tests run it in-process; the binary is a
# thin CLI over it. The library name does not repeat the package name.
[lib]
name = "ship_archive"

[dependencies]
hyperion-ship = { workspace = true, features = ["archive"] }
anyhow = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }   # checks that an --abi file is JSON before serving it
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
# Leveled, structured server logs (per-session close lines, per-read warnings, text or JSON),
# filtered with RUST_LOG. Crate-local, as in light-api, until other crates adopt them.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
hyperion-ship = { workspace = true, features = ["testkit"] }
tempfile = "3"
