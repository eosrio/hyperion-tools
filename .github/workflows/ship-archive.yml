name: antelope-ship-archive

on:
  push:
    branches: [main, master]
    paths: ['crates/core/**', 'crates/ship-archive/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ship-archive.yml']
  pull_request:
    paths: ['crates/core/**', 'crates/ship-archive/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ship-archive.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: ['1.95.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check the complete Windows workspace at the supported minimum and current compiler
        if: runner.os == 'Windows'
        run: cargo check --locked --workspace --all-targets
      - run: cargo fmt --all --check
      # The core's archive readers, protocol codec and fixture writers (off by default).
      - run: cargo clippy --locked --package hyperion-ship --features archive,testkit --all-targets -- -D warnings
      - run: cargo test --locked --package hyperion-ship --features archive,testkit
      # The core's chain API request parsing and body rendering (off by default).
      - run: cargo clippy --locked --package hyperion-ship --features chain-api,testkit --all-targets -- -D warnings
      - run: cargo test --locked --package hyperion-ship --features chain-api,testkit
      # The server, with its in-process conformance tests.
      - run: cargo clippy --locked --package antelope-ship-archive --all-targets -- -D warnings
      - run: cargo test --locked --package antelope-ship-archive
      - run: cargo build --release --locked --package antelope-ship-archive
