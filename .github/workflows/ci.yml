name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.95.0', stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.rust == '1.95.0' && '24' || '26' }}
      - name: Verify Wire node setup evidence checksums
        working-directory: docs/qualification/evidence/wire-node-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify actual Wire testnet source evidence
        run: python3 scripts/check-wire-testnet-evidence.py
      - name: Check actual-testnet codec regression syntax
        run: node --check scripts/check-wire-testnet-capture.mjs
      - name: Check runtime probe syntax
        run: node --check scripts/profile-runtime-smoke.mjs
      - name: Test runtime probe failure reporting
        run: node --test scripts/profile-runtime-smoke.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --release --verbose
      - name: Test
        run: cargo test --locked --release --verbose
