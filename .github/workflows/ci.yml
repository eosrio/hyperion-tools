name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wire node setup evidence checksums
        working-directory: docs/qualification/evidence/wire-node-20261019
        run: sha256sum -c SHA256SUMS
      - name: Check runtime probe syntax
        run: node --check scripts/profile-runtime-smoke.mjs
      - name: Test runtime probe failure reporting
        run: node --test scripts/profile-runtime-smoke.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --release --verbose

  sequence-json-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify exact Rust sequence JSON with Node (not Wire qualification)
        run: node scripts/check-sequence-json.mjs --release
